analyzer:
  exclude:
    - build/**
    - web/**
    - windows/**
    - android/**
    # Code review snapshots, not part of the build: they keep the import
    # paths of the files they were copied from, so they do not resolve here.
    - docs/**
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    avoid_print: true
